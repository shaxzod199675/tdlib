name: Build TDLib

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Get TDLib
        run: |
          git clone --branch v1.8.0 --depth 1 https://github.com/tdlib/td.git

      - name: Build OpenSSL
        run: |
          export ANDROID_NDK=$ANDROID_HOME/ndk/27.3.13750724
          cd $GITHUB_WORKSPACE/td/example/android
          ./build-openssl.sh SDK $ANDROID_NDK OpenSSL_1_1_1w

      - name: Build TDLib
        run: |
          export ANDROID_NDK=$ANDROID_HOME/ndk/27.3.13750724
          cd $GITHUB_WORKSPACE/td/example/android
          ./build-tdlib.sh SDK $ANDROID_NDK OpenSSL c++_static Java
          ls -la tdlib/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-android-arm64
          path: ${{ github.workspace }}/td/example/android/tdlib/
