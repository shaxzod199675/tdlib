name: Build TDLib

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get TDLib
        run: |
          git clone --branch v1.8.0 --depth 1 https://github.com/tdlib/td.git

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create stub mime_type files
        run: |
          mkdir -p td/tdutils/generate/auto
          # Create stub mime_type files - these are minimal implementations
          echo 'const char* get_mime_type_extension(const char* mime_type) { return nullptr; }' > td/tdutils/generate/auto/mime_type_to_extension.cpp
          echo 'const char* get_extension_mime_type(const char* extension) { return nullptr; }' > td/tdutils/generate/auto/extension_to_mime_type.cpp

      - name: Build OpenSSL
        run: |
          export ANDROID_NDK=$ANDROID_HOME/ndk/27.3.13750724
          export PATH=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          cd td
          wget https://www.openssl.org/source/openssl-1.1.1w.tar.gz
          tar xzf openssl-1.1.1w.tar.gz
          cd openssl-1.1.1w
          ./Configure android-arm64 --cross-compile-prefix=aarch64-linux-android- --prefix=$GITHUB_WORKSPACE/openssl-install
          make -j$(nproc)
          make install_sw

      - name: Build TDLib
        run: |
          export ANDROID_NDK=$ANDROID_HOME/ndk/27.3.13750724
          export PATH=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH

          cd $GITHUB_WORKSPACE/td
          mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI="arm64-v8a" \
                -DANDROID_PLATFORM=android-24 \
                -DANDROID_STL=c++_shared \
                -DTD_ENABLE_JNI=ON \
                -DTDUTILS_MIME_TYPE=OFF \
                -DOPENSSL_ROOT_DIR=$GITHUB_WORKSPACE/openssl-install \
                -DOPENSSL_CRYPTO_LIBRARY=$GITHUB_WORKSPACE/openssl-install/lib/libcrypto.a \
                -DOPENSSL_SSL_LIBRARY=$GITHUB_WORKSPACE/openssl-install/lib/libssl.a \
                -DOPENSSL_INCLUDE_DIR=$GITHUB_WORKSPACE/openssl-install/include \
                -DCMAKE_BUILD_TYPE=Release \
                ..
          cmake --build . --target all -j$(nproc) || true
          cmake --build . --target tdjson -j$(nproc) || true
          find . -name "*.so" 2>/dev/null | head -10

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-android-arm64
          path: ${{ github.workspace }}/td/build/*.so
