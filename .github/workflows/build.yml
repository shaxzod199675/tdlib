name: Build TDLib

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y openjdk-17-jdk gperf make perl php-cli unzip wget curl

      - name: Get TDLib
        run: |
          git clone --branch v1.8.0 --depth 1 https://github.com/tdlib/td.git

      - name: Build OpenSSL
        run: |
          export ANDROID_NDK=$ANDROID_HOME/ndk/27.3.13750724
          export PATH=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          cd $GITHUB_WORKSPACE
          wget -q https://www.openssl.org/source/openssl-1.1.1w.tar.gz
          tar xzf openssl-1.1.1w.tar.gz
          cd openssl-1.1.1w
          ./Configure android-arm64 --cross-compile-prefix=aarch64-linux-android- --prefix=$GITHUB_WORKSPACE/openssl-install
          make -j$(nproc)
          make install_sw

      - name: Build TDLib using example/android
        run: |
          export ANDROID_NDK=$ANDROID_HOME/ndk/27.3.13750724
          export PATH=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          export OPENSSL_ROOT_DIR=$GITHUB_WORKSPACE/openssl-install
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64

          cd $GITHUB_WORKSPACE/td/example/android
          ./build-tdlib.sh SDK $ANDROID_NDK OpenSSL c++_static Java
          ls -la tdlib/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-android-arm64
          path: ${{ github.workspace }}/td/example/android/tdlib/
