name: Build TDLib

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build TDLib Android
        uses: docker/build-push-action@v5
        with:
          context: .
          file: td/example/android/Dockerfile
          platforms: linux/amd64
          build-args: |
            ANDROID_NDK_VERSION=23.2.8568313
            COMMIT_HASH=v1.8.0
            ANDROID_STL=c++_static
            TDLIB_INTERFACE=Java
          outputs: type=local,dest=/tmp/tdlib-output

      - name: Show build output
        run: |
          ls -la /tmp/tdlib-output/ || echo "No output"
          find /tmp/tdlib-output -name "*.so" 2>/dev/null || echo "No .so files"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-android-arm64
          path: /tmp/tdlib-output/
