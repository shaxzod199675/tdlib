name: Build TDLib

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Get TDLib
        run: |
          git clone --branch v1.8.0 --depth 1 https://github.com/tdlib/td.git

      - name: Build OpenSSL
        run: |
          export ANDROID_NDK=$ANDROID_HOME/ndk/27.3.13750724
          export PATH=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          cd $GITHUB_WORKSPACE
          wget -q https://www.openssl.org/source/openssl-1.1.1w.tar.gz
          tar xzf openssl-1.1.1w.tar.gz
          cd openssl-1.1.1w
          ./Configure android-arm64 --cross-compile-prefix=aarch64-linux-android- --prefix=$GITHUB_WORKSPACE/openssl-install
          make -j$(nproc)
          make install_sw

      - name: Create stub mime_type files
        run: |
          mkdir -p td/tdutils/generate/auto
          echo 'const char* get_mime_type_extension(const char* mime_type) { return nullptr; }' > td/tdutils/generate/auto/mime_type_to_extension.cpp
          echo 'const char* get_extension_mime_type(const char* extension) { return nullptr; }' > td/tdutils/generate/auto/extension_to_mime_type.cpp

      - name: Build TDLib (JSON interface)
        run: |
          export ANDROID_NDK=$ANDROID_HOME/ndk/27.3.13750724
          export PATH=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          export OPENSSL_ROOT_DIR=$GITHUB_WORKSPACE/openssl-install

          cd $GITHUB_WORKSPACE/td
          mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI="arm64-v8a" \
                -DANDROID_PLATFORM=android-24 \
                -DANDROID_STL=c++_shared \
                -DTD_ENABLE_JNI=ON \
                -DTDUTILS_MIME_TYPE=OFF \
                -DOPENSSL_ROOT_DIR=$OPENSSL_ROOT_DIR \
                -DCMAKE_BUILD_TYPE=Release \
                ..
          make -j$(nproc) tdjson VERBOSE=1 2>&1 | tail -50
          echo "=== Build artifacts ==="
          SO_FILES=$(find . -name "*.so" -type f 2>/dev/null)
          A_FILES=$(find . -name "*.a" -type f 2>/dev/null)
          echo "SO files: $SO_FILES"
          echo "A files: $A_FILES"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-android-arm64
          path: ${{ github.workspace }}/td/build/**/*.so
