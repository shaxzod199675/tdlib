name: Build TDLib

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Get TDLib
        run: |
          git clone --branch v1.8.0 --depth 1 https://github.com/tdlib/td.git

      - name: Build OpenSSL
        run: |
          cd $GITHUB_WORKSPACE
          wget -q https://www.openssl.org/source/openssl-1.1.1w.tar.gz
          tar xzf openssl-1.1.1w.tar.gz
          cd openssl-1.1.1w
          ./Configure android-arm64 --prefix=$GITHUB_WORKSPACE/openssl-install
          make -j$(nproc)
          make install_sw

      - name: Build TDLib (JSON interface)
        run: |
          export ANDROID_NDK=$ANDROID_HOME/ndk/25.2.0
          export PATH=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          export OPENSSL_ROOT_DIR=$GITHUB_WORKSPACE/openssl-install

          cd $GITHUB_WORKSPACE
          mkdir td/build && cd td/build
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI="arm64-v8a" \
                -DANDROID_PLATFORM=android-24 \
                -DANDROID_STL=c++_shared \
                -DOPENSSL_ROOT_DIR=$OPENSSL_ROOT_DIR \
                -DCMAKE_BUILD_TYPE=Release \
                ..
          make -j$(nproc) tdjson
          ls -la *.so 2>/dev/null || echo "No .so files found"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-android-arm64
          path: ${{ github.workspace }}/td/build/*.so
